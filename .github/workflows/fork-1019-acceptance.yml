name: Fork acceptance for issue 1019
'on':
  push:
    branches:
    - codex/ci-1019-acceptance
permissions:
  contents: read
jobs:
  js-control:
    name: Baseline / real JS E2E with interpreter
    runs-on: ubuntu-latest
    env:
      RUN_CODE_INTERPRETER_E2E: 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: f26a716a11238b88d13a56242104e93e9d01c37d
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - name: Clean Docker runner cache
      run: bash scripts/ci-docker-cleanup.sh
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
    - name: Verify uv
      run: 'uv --version

        uv run python --version

        '
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.19.0
    - name: Clean up previous E2E resources
      run: 'docker ps -aq --filter "label=opensandbox" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-credential-vault-target || true

        docker ps -aq --filter "label=opensandbox.e2e=credential-vault" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-redis || true

        docker run --rm -v /tmp:/host_tmp alpine rm -rf /host_tmp/opensandbox-e2e || true

        docker image prune -f || true

        '
    - name: Build local egress image
      run: docker build -t opensandbox/egress:local -f components/egress/Dockerfile .
    - name: Start Redis for JavaScript pool E2E
      run: "docker rm -f opensandbox-e2e-redis || true\ndocker run -d --name opensandbox-e2e-redis -p 127.0.0.1::6379 redis:7-alpine\nREDIS_PORT=\"$(docker inspect -f '{{(index (index .NetworkSettings.Ports \"6379/tcp\") 0).HostPort}}' opensandbox-e2e-redis)\"\
        \necho \"OPENSANDBOX_TEST_REDIS_URL=redis://127.0.0.1:${REDIS_PORT}/0\" >> \"$GITHUB_ENV\"\nfor i in {1..30}; do\n  if docker exec opensandbox-e2e-redis redis-cli ping | grep -q PONG; then\n    exit 0\n  fi\n  sleep 1\ndone\ndocker logs\
        \ opensandbox-e2e-redis\nexit 1\n"
    - name: Run tests
      run: 'set -e


        # Create config file (match other E2E jobs)

        cat <<EOF > ~/.sandbox.toml

        [server]

        host = "127.0.0.1"

        port = 8080

        api_key = ""

        [log]

        level = "INFO"

        [runtime]

        type = "docker"

        execd_image = "opensandbox/execd:local"

        execd_run_as_init = true

        [egress]

        image = "opensandbox/egress:local"

        mode = "dns+nft"

        [docker]

        network_mode = "bridge"

        [storage]

        allowed_host_paths = ["/tmp/opensandbox-e2e"]

        EOF


        bash ./scripts/javascript-e2e.sh

        '
    - name: Eval server logs
      if: ${{ always() }}
      run: cat server/server.log
    - name: Clean up after E2E
      if: always()
      run: 'docker ps -aq --filter "label=opensandbox" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-credential-vault-target || true

        docker ps -aq --filter "label=opensandbox.e2e=credential-vault" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-redis || true

        docker run --rm -v /tmp:/host_tmp alpine rm -rf /host_tmp/opensandbox-e2e || true

        '
    timeout-minutes: 90
  js-focused:
    name: Candidate / javascript failed interpreter cases
    runs-on: ubuntu-latest
    env:
      RUN_CODE_INTERPRETER_E2E: 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - name: Clean Docker runner cache
      run: bash scripts/ci-docker-cleanup.sh
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
    - name: Verify uv
      run: 'uv --version

        uv run python --version

        '
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.19.0
    - name: Clean up previous E2E resources
      run: 'docker ps -aq --filter "label=opensandbox" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-credential-vault-target || true

        docker ps -aq --filter "label=opensandbox.e2e=credential-vault" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-redis || true

        docker run --rm -v /tmp:/host_tmp alpine rm -rf /host_tmp/opensandbox-e2e || true

        docker image prune -f || true

        '
    - name: Build local egress image
      run: docker build -t opensandbox/egress:local -f components/egress/Dockerfile .
    - name: Start Redis for JavaScript pool E2E
      run: "docker rm -f opensandbox-e2e-redis || true\ndocker run -d --name opensandbox-e2e-redis -p 127.0.0.1::6379 redis:7-alpine\nREDIS_PORT=\"$(docker inspect -f '{{(index (index .NetworkSettings.Ports \"6379/tcp\") 0).HostPort}}' opensandbox-e2e-redis)\"\
        \necho \"OPENSANDBOX_TEST_REDIS_URL=redis://127.0.0.1:${REDIS_PORT}/0\" >> \"$GITHUB_ENV\"\nfor i in {1..30}; do\n  if docker exec opensandbox-e2e-redis redis-cli ping | grep -q PONG; then\n    exit 0\n  fi\n  sleep 1\ndone\ndocker logs\
        \ opensandbox-e2e-redis\nexit 1\n"
    - name: Run tests
      run: 'set -e


        # Create config file (match other E2E jobs)

        cat <<EOF > ~/.sandbox.toml

        [server]

        host = "127.0.0.1"

        port = 8080

        api_key = ""

        [log]

        level = "INFO"

        [runtime]

        type = "docker"

        execd_image = "opensandbox/execd:local"

        execd_run_as_init = true

        [egress]

        image = "opensandbox/egress:local"

        mode = "dns+nft"

        [docker]

        network_mode = "bridge"

        [storage]

        allowed_host_paths = ["/tmp/opensandbox-e2e"]

        EOF


        python3 - <<''LAUNCHER''

        from pathlib import Path

        source=Path(''scripts/javascript-e2e.sh'').read_text()

        assert source.count(''  pnpm test:ci\n'')==1

        Path(''scripts/.fork-1019-javascript.sh'').write_text(source.replace(''  pnpm test:ci\n'',''  pnpm run prep:sdk && pnpm exec vitest run tests/test_code_interpreter_e2e.test.ts --testNamePattern="05 context isolation"\n''))

        LAUNCHER

        bash ./scripts/.fork-1019-javascript.sh

        '
    - name: Eval server logs
      if: ${{ always() }}
      run: cat server/server.log
    - name: Clean up after E2E
      if: always()
      run: 'docker ps -aq --filter "label=opensandbox" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-credential-vault-target || true

        docker ps -aq --filter "label=opensandbox.e2e=credential-vault" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-redis || true

        docker run --rm -v /tmp:/host_tmp alpine rm -rf /host_tmp/opensandbox-e2e || true

        '
    timeout-minutes: 90
  java-focused:
    name: Candidate / java failed interpreter cases
    runs-on: ubuntu-latest
    env:
      RUN_CODE_INTERPRETER_E2E: 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - name: Clean Docker runner cache
      run: bash scripts/ci-docker-cleanup.sh
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
    - name: Verify uv
      run: 'uv --version

        uv run python --version

        '
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '8'
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Clean up previous E2E resources
      run: 'docker ps -aq --filter "label=opensandbox" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-credential-vault-target || true

        docker ps -aq --filter "label=opensandbox.e2e=credential-vault" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-redis || true

        docker run --rm -v /tmp:/host_tmp alpine rm -rf /host_tmp/opensandbox-e2e || true

        docker image prune -f || true

        '
    - name: Build local egress image
      run: docker build -t opensandbox/egress:local -f components/egress/Dockerfile .
    - name: Start Redis for Java pool E2E
      run: "docker rm -f opensandbox-e2e-redis || true\ndocker run -d --name opensandbox-e2e-redis -p 127.0.0.1::6379 redis:7-alpine\nREDIS_PORT=\"$(docker inspect -f '{{(index (index .NetworkSettings.Ports \"6379/tcp\") 0).HostPort}}' opensandbox-e2e-redis)\"\
        \necho \"OPENSANDBOX_TEST_REDIS_URL=redis://127.0.0.1:${REDIS_PORT}/0\" >> \"$GITHUB_ENV\"\nfor i in {1..30}; do\n  if docker exec opensandbox-e2e-redis redis-cli ping | grep -q PONG; then\n    exit 0\n  fi\n  sleep 1\ndone\ndocker logs\
        \ opensandbox-e2e-redis\nexit 1\n"
    - name: Run tests
      env:
        GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
        OPENSANDBOX_TEST_SECURE_ACCESS_VERIFIABLE: 'false'
      run: 'set -e

        export GRADLE_OPTS="-Dorg.gradle.java.installations.auto-detect=true -Dorg.gradle.java.installations.auto-download=false -Dorg.gradle.java.installations.paths=${JAVA_HOME_8_X64},${JAVA_HOME_17_X64}"


        # Create config file

        cat <<EOF > ~/.sandbox.toml

        [server]

        host = "127.0.0.1"

        port = 8080

        api_key = ""

        [log]

        level = "INFO"

        [runtime]

        type = "docker"

        execd_image = "opensandbox/execd:local"

        execd_run_as_init = true

        [egress]

        image = "opensandbox/egress:local"

        mode = "dns+nft"

        [docker]

        network_mode = "bridge"

        [storage]

        allowed_host_paths = ["/tmp/opensandbox-e2e"]

        EOF


        python3 - <<''LAUNCHER''

        from pathlib import Path

        source=Path(''scripts/java-e2e.sh'').read_text()

        assert source.count(''  ./gradlew test\n'')==1

        Path(''scripts/.fork-1019-java.sh'').write_text(source.replace(''  ./gradlew test\n'',''  ./gradlew test --tests "*CodeInterpreterE2ETest.testJavaCodeExecution" --tests "*CodeInterpreterE2ETest.testPythonCodeExecution"\n''))

        LAUNCHER

        bash ./scripts/.fork-1019-java.sh

        '
    - name: Eval server logs
      if: ${{ always() }}
      run: cat server/server.log
    - name: Clean up after E2E
      if: always()
      run: 'docker ps -aq --filter "label=opensandbox" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-credential-vault-target || true

        docker ps -aq --filter "label=opensandbox.e2e=credential-vault" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-redis || true

        docker run --rm -v /tmp:/host_tmp alpine rm -rf /host_tmp/opensandbox-e2e || true

        '
    timeout-minutes: 90
