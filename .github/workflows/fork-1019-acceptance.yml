    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.25.0
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.7.6
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.30.13
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.21.3
    - name: Install Kind
      run: 'go install sigs.k8s.io/kind@v0.31.0

        echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

        '
    - name: Package umbrella release candidate once
      id: package
      run: "set -euo pipefail\nchart_path=\"manifests/charts/opensandbox\"\nchart_version=\"$(awk '$1 == \"version:\" {gsub(/\"/, \"\", $2); print $2; exit}' \"$chart_path/Chart.yaml\")\"\napp_version=\"$(awk '$1 == \"appVersion:\" {gsub(/\"\
        /, \"\", $2); print $2; exit}' \"$chart_path/Chart.yaml\")\"\npackage_name=\"opensandbox-${chart_version}.tgz\"\n\nhelm dependency build \"$chart_path\"\nhelm lint \"$chart_path\"\nmkdir -p dist\nhelm package \"$chart_path\" --destination\
        \ dist\nmanifests/release/verify-helm-package.sh \\\n  \"dist/$package_name\" opensandbox \"$chart_version\" \"$app_version\"\npackage_sha256=\"$(sha256sum \"dist/$package_name\" | awk '{print $1}')\"\nprintf '%s  %s\\n' \"$package_sha256\"\
        \ \"$package_name\" >dist/SHA256SUMS\necho \"package_name=$package_name\" >>\"$GITHUB_OUTPUT\"\n"
    - name: Verify single-active Server defaults
      env:
        PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
      run: "set -euo pipefail\n\nhelm template opensandbox-server manifests/charts/server \\\n  --show-only templates/deployment.yaml >/tmp/opensandbox-server-rendered.yaml\ngrep -qx '  replicas: 1' /tmp/opensandbox-server-rendered.yaml\ngrep\
        \ -qx '    type: Recreate' /tmp/opensandbox-server-rendered.yaml\n\nhelm template opensandbox \"dist/$PACKAGE_NAME\" \\\n  --show-only charts/opensandbox-server/templates/deployment.yaml \\\n  >/tmp/opensandbox-umbrella-server-rendered.yaml\n\
        grep -qx '  replicas: 1' /tmp/opensandbox-umbrella-server-rendered.yaml\ngrep -qx '    type: Recreate' /tmp/opensandbox-umbrella-server-rendered.yaml\n"
  other-nightly-core:
    name: Controller E2E Core Full Matrix (Kubernetes v${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version:
        - 1.24.4
        - 1.26.4
        - 1.30.4
        - 1.32.2
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.25.0
        cache-dependency-path: kubernetes/go.sum
    - name: Run core e2e tests
      working-directory: kubernetes
      run: 'make test-e2e-core KIND_K8S_VERSION=v${{ matrix.version }}

        '
    timeout-minutes: 90
  runtime-gvisor:
    name: gVisor RuntimeClass on Kind
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - *id001
    - working-directory: kubernetes
      env:
        KIND: kind
      run: make docker-build && make test-gvisor
  runtime-qemu:
    name: QEMU VMState / KVM availability and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - *id001
    - working-directory: kubernetes
      run: ls -l /dev/kvm && docker run --rm --device /dev/kvm alpine sh -c "test -r /dev/kvm && test -w /dev/kvm" && make test-e2e-qemu
