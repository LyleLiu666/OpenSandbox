      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.25.9
        cache-dependency-path: components/execd/go.sum
    - name: Check gofmt
      working-directory: components/execd
      run: "files=\"$(gofmt -l . ../internal)\"\nif [ -n \"$files\" ]; then\n  echo \"$files\"\n  exit 1\nfi\n"
    - name: Run golint
      working-directory: components/execd
      run: 'make golint

        '
