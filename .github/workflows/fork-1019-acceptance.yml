name: Fork acceptance for issue 1019
'on':
  push:
    branches:
    - codex/ci-1019-acceptance
permissions:
  contents: read
jobs:
  egress-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - name: Set up exact Go for held-old HTTP/2 fixture
      uses: actions/setup-go@v6
      with:
        go-version: 1.27.2
        cache: false
    - name: Test and build held-old Go fixture
      env:
        GOTOOLCHAIN: local
        GOWORK: 'off'
        GOPROXY: 'off'
        GO111MODULE: 'off'
        GOCACHE: ${{ runner.temp }}/go1272-cache
        GOMODCACHE: ${{ runner.temp }}/go1272-modcache
      run: "test \"$(go version)\" = \"go version go1.27.2 linux/amd64\"\nmkdir -p \"$GOCACHE\" \"$GOMODCACHE\"\ngo test components/egress/tests/fixtures/h2_retry_client.go \\\n  components/egress/tests/fixtures/h2_retry_client_test.go\ngo build\
        \ -trimpath \\\n  -o \"$RUNNER_TEMP/h2_retry_client-go1.27.2\" \\\n  components/egress/tests/fixtures/h2_retry_client.go\n"
    - name: Set up Python for H2 runtime coverage
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: components/egress/requirements-mitmproxy.txt
    - name: Prepare pinned H2 runtime environment
      run: "python -m venv \"$RUNNER_TEMP/h2-runtime-venv\"\n\"$RUNNER_TEMP/h2-runtime-venv/bin/python\" -m pip install \\\n  -r components/egress/requirements-mitmproxy.txt\n"
    - name: Run pinned H2 lifecycle and watchdog regressions
      run: "\"$RUNNER_TEMP/h2-runtime-venv/bin/python\" -m unittest discover -v \\\n  -s components/egress/tests -p 'test_credential_bound_h2*.py'\n"
    - name: Run H2 loopback runtime regressions
      id: h2_loopback_runtime
      run: "sudo \"$RUNNER_TEMP/h2-runtime-venv/bin/python\" \\\n  components/egress/tests/test_credential_bound_h2_runtime.py \\\n  --run-real-runtime --artifacts \"$RUNNER_TEMP/h2-runtime-evidence\"\n"
    - name: Run Go held-old early-notice H1 and H2 cases
      if: steps.h2_loopback_runtime.outcome == 'success'
      run: "sudo env -u GODEBUG \\\n  \"$RUNNER_TEMP/h2-runtime-venv/bin/python\" \\\n  components/egress/tests/test_credential_bound_h2_runtime.py \\\n  --run-real-runtime \\\n  --artifacts \"$RUNNER_TEMP/h2-runtime-evidence/go-early-notice\"\
        \ \\\n  --case go_early_notice_h1_origin \\\n  --case go_early_notice_h2_origin \\\n  --go-client \"$RUNNER_TEMP/h2_retry_client-go1.27.2\" \\\n  --require-go-version go1.27.2\n"
    - name: Run static TLS passthrough runtime regressions
      run: "expected_parent_netns=\"$(readlink /proc/self/ns/net)\"\nsudo env \\\n  EXPECTED_PARENT_NETNS=\"$expected_parent_netns\" \\\n  H2_RUNTIME_PYTHON=\"$RUNNER_TEMP/h2-runtime-venv/bin/python\" \\\n  PATH=\"$RUNNER_TEMP/h2-runtime-venv/bin:$PATH\"\
        \ \\\n  OPENSANDBOX_STATIC_RUNTIME_TESTS=1 \\\n  OPENSANDBOX_STATIC_RUNTIME_REQUIRE=1 \\\n  unshare --net bash -euo pipefail -c '\n    parent_netns=\"$(readlink \"/proc/$PPID/ns/net\")\"\n    child_netns=\"$(readlink /proc/self/ns/net)\"\
        \n    pid1_netns=\"$(readlink /proc/1/ns/net)\"\n    printf \"netns_guard child=%s expected_parent=%s actual_parent=%s pid1=%s\\\\n\" \\\n      \"$child_netns\" \"$EXPECTED_PARENT_NETNS\" \"$parent_netns\" \"$pid1_netns\"\n    test \"\
        $parent_netns\" = \"$EXPECTED_PARENT_NETNS\"\n    test \"$child_netns\" != \"$EXPECTED_PARENT_NETNS\"\n    test \"$child_netns\" != \"$pid1_netns\"\n    ip link set lo up\n    exec \"$H2_RUNTIME_PYTHON\" -m unittest discover -v \\\n \
        \     -s components/egress/tests -p \"static_passthrough_runtime_test.py\"\n  '\n"
    - name: Make H2 runtime evidence readable by the runner
      if: always()
      run: "if [ -d \"$RUNNER_TEMP/h2-runtime-evidence\" ]; then\n  sudo chown -R \"$(id -u):$(id -g)\" \"$RUNNER_TEMP/h2-runtime-evidence\"\nfi\n"
    - name: Set up unsupported Python for fail-closed checks
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: components/egress/requirements-mitmproxy.txt
    - name: Prepare unsupported-interpreter test environment
      run: "python -m venv \"$RUNNER_TEMP/h2-unsupported-venv\"\n\"$RUNNER_TEMP/h2-unsupported-venv/bin/python\" -m pip install \\\n  -r components/egress/requirements-mitmproxy.txt\n"
    - name: Verify Python 3.12 rejection and admission cleanup
      working-directory: components/egress/tests
      run: "\"$RUNNER_TEMP/h2-unsupported-venv/bin/python\" -m unittest -v \\\n  test_credential_bound_h2_compatibility \\\n  test_system_h2.SystemH2Hooks.test_unsupported_interpreter_denies_before_adapter_or_request_admission \\\n  test_credential_bound_h2_lifecycle.H2RuntimeLifecycleTest.test_actual_system_rejects_unsupported_interpreter_without_retaining_tls\n"
    name: egress / remaining H2 fixtures
