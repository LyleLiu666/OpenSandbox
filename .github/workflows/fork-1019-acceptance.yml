name: Fork acceptance for issue 1019
'on':
  push:
    branches:
    - codex/ci-1019-acceptance
permissions:
  contents: read
jobs:
  gvisor-egress:
    name: gVisor / optional egress incompatibility spec
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: false
    - env:
        EGRESS_IMG: opensandbox/egress:fork-1019
        KIND_CLUSTER: gvisor-test
        CONTROLLER_IMG: controller:dev
        TASK_EXECUTOR_IMG: task-executor:dev
      shell: bash
      run: 'set -eo pipefail

        docker build -t "$EGRESS_IMG" -f components/egress/Dockerfile .

        cd kubernetes

        make setup-gvisor KIND=kind

        kind load docker-image --name "$KIND_CLUSTER" "$EGRESS_IMG"

        make install-gvisor-deps KIND=kind

        kubectl apply -f test/e2e_runtime/gvisor/testdata/runtimeclass.yaml

        go test ./test/e2e_runtime/gvisor -count=1 -v -ginkgo.v -ginkgo.focus=''should fail to start the egress sidecar'' | tee "$RUNNER_TEMP/gvisor-egress.log"

        grep -Eq ''1 Passed'' "$RUNNER_TEMP/gvisor-egress.log"

        '
