      working-directory: components/execd
      run: 'make multi-build

        '
    - name: Run tests with coverage
      working-directory: components/execd
      run: 'go test -v -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./pkg/...

        '
    - name: Verify filesystem identity permissions as root
      working-directory: components/execd
      run: 'go test -c -o /tmp/execd-filesystem-identity.test ./pkg/web

        sudo /tmp/execd-filesystem-identity.test -test.run "^TestFilesystemIdentity" -test.v -test.timeout 90s

        go test -c -o /tmp/execd-filesystem-runtime.test ./pkg/runtime

        sudo /tmp/execd-filesystem-runtime.test -test.run "^TestFilesystem" -test.v -test.timeout 90s

        '
    - name: Verify OOM watcher smoke as root
      working-directory: components/execd
      run: '# End-to-end: a helper process joins a memory-limited cgroup, the

        # kernel OOM killer terminates it, and the execd OOM watcher must

        # emit its detection log line. Skips itself when cgroup v2 or root

        # is unavailable.

        go test -c -o /tmp/execd-oom-smoke.test ./pkg/telemetry

        sudo /tmp/execd-oom-smoke.test -test.run "^TestOOMSmoke$" -test.v -test.timeout 120s

        '
    - name: Run execd-ebpf variant tests
      working-directory: components/execd
      run: '# Regenerate the per-arch bytecode first: the generated files are

        # build artifacts (not committed), so local tests need them too.

        # clang ships in the GitHub-hosted ubuntu image; apt is only a

        # fallback for hosts without a toolchain.

        command -v clang >/dev/null || sudo apt-get update -qq && sudo apt-get install -y -qq clang >/dev/null

        make generate-ebpf ARCH=$(go env GOARCH)

        CGO_ENABLED=1 go test -tags ebpf -count=1 ./pkg/ebpf/

        '
    - name: Calculate coverage and generate summary
      working-directory: components/execd
      id: coverage
      run: '# Extract total coverage percentage

        TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep total | awk ''{print $3}'')

        echo "total_coverage=$TOTAL_COVERAGE" >> $GITHUB_OUTPUT


        # Generate GitHub Actions job summary

        echo "## 📊 execd Test Coverage Report" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Total Line Coverage:** $TOTAL_COVERAGE" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "Coverage report generated for commit \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "---" >> $GITHUB_STEP_SUMMARY

        echo "*Coverage targets: Core packages >80%, API layer >70%*" >> $GITHUB_STEP_SUMMARY

        '
