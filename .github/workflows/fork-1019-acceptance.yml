name: Fork acceptance for issue 1019
'on':
  push:
    branches:
    - codex/ci-1019-acceptance
permissions:
  contents: read
jobs:
  egress-prior-failures:
    name: egress / three macOS baseline failures on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - &id001
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: false
    - working-directory: components/egress
      run: go test -count=1 -v -run '^(TestActionsV2RetirementSurvivesRestartAndRejectsOldSet|TestRevisionPolicyIPCRealHandlersAndEpochContinuity|TestRevisionPolicyIPCDroppedPrepareUsesLocalEffectClassification)$' .
  docker-delete:
    name: Docker delete / TTL (real egress)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - uses: astral-sh/setup-uv@v7
    - run: docker build -f components/egress/Dockerfile -t opensandbox/egress:local .
    - working-directory: server
      env:
        OPENSANDBOX_TEST_DOCKER: '1'
        OPENSANDBOX_TEST_EGRESS_IMAGE: opensandbox/egress:local
        UV_PYTHON: '3.10'
      run: uv sync --all-groups --frozen && uv run pytest -v -ra tests/test_docker_delete_integration.py
  python-e2e:
    name: Python E2E (docker bridge)
    runs-on: ubuntu-latest
    env:
      RUN_CODE_INTERPRETER_E2E: 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - name: Clean Docker runner cache
      run: bash scripts/ci-docker-cleanup.sh
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
    - name: Verify uv
      run: 'uv --version

        uv run python --version

        '
    - name: Clean up previous E2E resources
      run: 'docker ps -aq --filter "label=opensandbox" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-credential-vault-target || true

        docker ps -aq --filter "label=opensandbox.e2e=credential-vault" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-egress-mitm-target || true

        docker ps -aq --filter "label=opensandbox.e2e=egress-mitm" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-redis || true

        # Remove root-owned files from previous sandbox runs by mounting parent dir

        docker run --rm -v /tmp:/host_tmp alpine rm -rf /host_tmp/opensandbox-e2e || true

        docker image prune -f || true

        '
    - name: Build local egress image
      run: docker build -t opensandbox/egress:local -f components/egress/Dockerfile .
    - name: Start Redis for Python pool E2E
      run: "docker rm -f opensandbox-e2e-redis || true\ndocker run -d --name opensandbox-e2e-redis -p 127.0.0.1::6379 redis:7-alpine\nREDIS_PORT=\"$(docker inspect -f '{{(index (index .NetworkSettings.Ports \"6379/tcp\") 0).HostPort}}' opensandbox-e2e-redis)\"\
        \necho \"OPENSANDBOX_TEST_REDIS_URL=redis://127.0.0.1:${REDIS_PORT}/0\" >> \"$GITHUB_ENV\"\nfor i in {1..30}; do\n  if docker exec opensandbox-e2e-redis redis-cli ping | grep -q PONG; then\n    exit 0\n  fi\n  sleep 1\ndone\ndocker logs\
        \ opensandbox-e2e-redis\nexit 1\n"
    - name: Run tests
      run: 'set -e


        # Create config file

        cat <<EOF > ~/.sandbox.toml

        [server]

        host = "127.0.0.1"

        port = 8080

        api_key = ""

        [log]

        level = "INFO"

        [runtime]

        type = "docker"

        execd_image = "opensandbox/execd:local"

        execd_run_as_init = true

        [egress]

        image = "opensandbox/egress:local"

        mode = "dns+nft"

        [docker]

        network_mode = "bridge"

        [storage]

        allowed_host_paths = ["/tmp/opensandbox-e2e"]

        [renew_intent]

        enabled = true

        min_interval_seconds = 60

        EOF


        ./scripts/python-e2e.sh

        '
    - name: Eval server logs
      if: ${{ always() }}
      run: cat server/server.log
    - name: Clean up after E2E
      if: always()
      run: 'docker ps -aq --filter "label=opensandbox" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-credential-vault-target || true

        docker ps -aq --filter "label=opensandbox.e2e=credential-vault" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-egress-mitm-target || true

        docker ps -aq --filter "label=opensandbox.e2e=egress-mitm" | xargs -r docker rm -f || true

        docker rm -f opensandbox-e2e-redis || true

        docker run --rm -v /tmp:/host_tmp alpine rm -rf /host_tmp/opensandbox-e2e || true

        '
    timeout-minutes: 90
  java-e2e:
    name: Java E2E (docker bridge)
