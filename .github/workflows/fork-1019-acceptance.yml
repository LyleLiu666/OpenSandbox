name: Fork acceptance for issue 1019
'on':
  push:
    branches:
    - codex/ci-1019-acceptance
permissions:
  contents: read
jobs:
  docker-delete-baseline:
    name: Docker delete / TTL control (default daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
      with:
        ref: f26a716a11238b88d13a56242104e93e9d01c37d
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - uses: astral-sh/setup-uv@v7
    - run: docker build -f components/egress/Dockerfile -t opensandbox/egress:local .
    - working-directory: server
      env:
        OPENSANDBOX_TEST_DOCKER: '1'
        OPENSANDBOX_TEST_EGRESS_IMAGE: opensandbox/egress:local
        UV_PYTHON: '3.10'
      run: uv sync --all-groups --frozen && uv run pytest -v -ra tests/test_docker_delete_integration.py
  docker-kernel-forwarding:
    name: Docker delete / TTL, kernel port forwarding (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ matrix.sha }}
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - name: Use kernel port forwarding for loopback readiness
      run: 'sudo python3 - <<''CONFIG''

        import json

        from pathlib import Path

        p = Path(''/etc/docker/daemon.json'')

        config = json.loads(p.read_text()) if p.exists() else {}

        config[''userland-proxy''] = False

        p.write_text(json.dumps(config))

        CONFIG

        sudo systemctl restart docker

        docker info --format ''{{.ServerVersion}}''

        '
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - uses: astral-sh/setup-uv@v7
    - run: docker build -f components/egress/Dockerfile -t opensandbox/egress:local .
    - working-directory: server
      env:
        OPENSANDBOX_TEST_DOCKER: '1'
        OPENSANDBOX_TEST_EGRESS_IMAGE: opensandbox/egress:local
        UV_PYTHON: '3.10'
      run: uv sync --all-groups --frozen && uv run pytest -v -ra tests/test_docker_delete_integration.py
    strategy:
      fail-fast: false
      matrix:
        include:
        - revision: candidate
          sha: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        - revision: baseline
          sha: f26a716a11238b88d13a56242104e93e9d01c37d
  kind-direct-retry:
    name: Kind direct / dependency download retry
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: direct
          script: scripts/python-k8s-e2e.sh
          e2e_gateway_route_mode: ''
          execd_run_as_init: 'false'
    env:
      KIND_CLUSTER: opensandbox-e2e
      KIND_K8S_VERSION: v1.30.4
      KUBECONFIG_PATH: /tmp/opensandbox-kind-kubeconfig
      KUBECONFIG: /tmp/opensandbox-kind-kubeconfig
      OPENSANDBOX_E2E_SANDBOX_CPU: 250m
      OPENSANDBOX_E2E_SANDBOX_MEMORY: 512Mi
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.25.0
        cache-dependency-path: kubernetes/go.sum
    - name: Add Go bin to PATH
      run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: latest
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
    - name: Set up Helm
      uses: azure/setup-helm@v4
    - name: Run Kubernetes runtime E2E
      env:
        E2E_GATEWAY_ROUTE_MODE: ${{ matrix.e2e_gateway_route_mode }}
        E2E_EXECD_RUN_AS_INIT: ${{ matrix.execd_run_as_init }}
      run: bash "./${{ matrix.script }}"
    - name: Dump kind diagnostics
      if: always()
      run: 'kubectl get pods -A -o wide || true

        kubectl get batchsandboxes -A || true

        kubectl get pv,pvc -A || true

        kubectl describe deployment -n opensandbox-system opensandbox-controller-manager || true

        kubectl describe deployment -n opensandbox-system opensandbox-server || true

        kubectl get svc -n opensandbox-system opensandbox-server || true

        '
    - name: Eval in-cluster server logs
      if: always()
      run: 'kubectl logs -n opensandbox-system deployment/opensandbox-server || true

        cat /tmp/opensandbox-server-port-forward.log || true

        '
    - name: Clean up Kind cluster
      if: always()
      run: 'kind delete cluster --name "${KIND_CLUSTER}" || true

        '
    timeout-minutes: 90
