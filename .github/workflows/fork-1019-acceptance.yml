name: Fork acceptance for issue 1019
'on':
  push:
    branches:
    - codex/ci-1019-acceptance
permissions:
  contents: read
jobs:
  host-copy-privileged:
    name: Optional host-mounted lifecycle copy / single spec
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: false
    - working-directory: kubernetes
      env:
        OPEN_SANDBOX_E2E_HOST_COPY: 'true'
        KIND_CLUSTER: osb-host-copy
        E2E_POD_SECURITY_ENFORCE: privileged
      run: "set -eo pipefail\nmkdir -p /tmp/opensandbox-host-copy\ncat <<'CONFIG' | kind create cluster --name \"$KIND_CLUSTER\" --image kindest/node:v1.28.6 --config -\nkind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nnodes:\n- role: control-plane\n\
        \  extraMounts:\n  - hostPath: /tmp/opensandbox-host-copy\n    containerPath: /mnt/opensandbox-host-copy\nCONFIG\nmake test-e2e-core KIND=kind GINKGO_ARGS='-ginkgo.focus=should.copy.files.between.a.host-mounted.directory' | tee \"$RUNNER_TEMP/host-copy.log\"\
        \ngrep -Eq \"1 Passed\" \"$RUNNER_TEMP/host-copy.log\""
      shell: bash
  nodeagent-win:
    name: Node agent / native Windows tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
      with:
        ref: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
        persist-credentials: false
    - name: Reserve runner space for local builds
      if: runner.os == 'Linux'
      shell: bash
      run: df -h /; sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc; df -h /
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: false
    - working-directory: components/nodeagent
      run: go test -count=1 -cover ./...
