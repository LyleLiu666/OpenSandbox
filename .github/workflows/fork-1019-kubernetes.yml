name: Fork validation for issue 1019
on:
  push:
    branches: [codex/ci-1019-kubernetes]

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'LyleLiu666/OpenSandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: baseline
            sha: f26a716a11238b88d13a56242104e93e9d01c37d
          - revision: candidate
            sha: bfd4a6aba4d171afd5f53d8c13d515a0c966a7a4
    name: ${{ matrix.revision }} pause-resume on Kubernetes v1.28.6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: kubernetes/go.sum
      - working-directory: kubernetes
        run: make test-e2e-pause-resume KIND_K8S_VERSION=v1.28.6
